global_comp_c_flags = ["-std=c23"]

[builder.linux_release]
platform = "linux"
comp_flags = ["-DPLATFORM_LINUX"]
binaries = ["hello_world"]

[builder.linux_debug]
platform = "linux"
comp_flags = ["-DPLATFORM_LINUX", "-DDEBUG"]
binaries = ["hello_world"]

[builder.windows_release]
platform = "windows"
comp_flags = ["-DPLATFORM_WINDOWS"]
binaries = ["hello_world"]

[builder.windows_debug]
platform = "windows"
comp_flags = ["-DPLATFORM_WINDOWS", "-DDEBUG"]
binaries = ["hello_world"]

[binary.hello_world]
type = "executable"
sources = ["main"]